<!doctype html>
<!--
  Source for the WordPress.org listing banners (wporg-assets/banner-*.png).

  1544x500 is exactly 2x 772x250, so this one file renders both — open it in a
  headless browser at a 772x250 viewport and screenshot at deviceScaleFactor 1
  and 2. With Playwright installed anywhere:

    page = await browser.newPage({ viewport: {width: 772, height: 250},
                                   deviceScaleFactor: 1 })
    await page.goto('file://.../banner-source.html', {waitUntil: 'networkidle'})
    await page.evaluate(() => document.fonts.ready)
    await page.screenshot({ path: 'banner-772x250.png' })

  Colours are the site's "Paper & Ink" palette; fonts load from the fontsource
  CDN so this renders the same on any machine. Keep the content block's
  padding-bottom — the directory overlays the plugin icon on the bottom-left.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Fraunces';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2') format('woff2-variations');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Archivo';
    src: url('https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 900;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 772px; height: 250px; }

  body {
    background: #F4EEE1;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Faint ruled-paper texture: the "Paper & Ink" ground, not a gradient. */
  .rules {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(28,24,18,0.035) 0px,
      rgba(28,24,18,0.035) 1px,
      transparent 1px,
      transparent 22px
    );
  }

  /* Sealing-wax rule down the left edge — the single accent, used as a margin mark. */
  .edge {
    position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
    background: #C2401C;
  }

  /* padding-bottom lifts the block clear of the plugin icon, which the
     directory overlays onto the banner's bottom-left corner. */
  .content {
    position: absolute;
    left: 52px; top: 0; bottom: 0;
    width: 470px;
    padding-bottom: 34px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 14px;
  }

  .lockup { display: flex; align-items: center; gap: 16px; }

  .mark { width: 56px; height: 56px; display: block; border-radius: 12px; }

  .wordmark {
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'SOFT' 0, 'WONK' 1, 'opsz' 48, 'wght' 800;
    font-size: 46px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #1C1812;
  }

  .tagline {
    font-family: 'Archivo', system-ui, sans-serif;
    font-variation-settings: 'wght' 500;
    font-size: 17px;
    line-height: 1.45;
    color: #57503F;
    max-width: 430px;
  }
  .tagline b {
    font-variation-settings: 'wght' 700;
    color: #1C1812;
  }

  .stamp {
    font-family: 'Archivo', system-ui, sans-serif;
    font-variation-settings: 'wght' 600;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9C937D;
  }

  /* Right-hand motif: a fanned document with a read-through bar.
     Decorative only — WP.org crops this side on narrow viewports. */
  .motif { position: absolute; right: 30px; top: 0; bottom: 0; width: 250px; }
</style>
</head>
<body>
  <div class="rules"></div>
  <div class="edge"></div>

  <svg class="motif" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- back sheets, fanned -->
    <g stroke="#1C1812" stroke-opacity="0.18" fill="#FCFAF4">
      <rect x="42" y="58" width="120" height="150" rx="6" transform="rotate(-8 102 133)"/>
      <rect x="58" y="52" width="120" height="150" rx="6" transform="rotate(-3.5 118 127)"/>
    </g>
    <!-- front sheet -->
    <rect x="74" y="46" width="126" height="158" rx="7" fill="#FCFAF4" stroke="#1C1812" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- folded corner -->
    <path d="M175 46 L200 71 L175 71 Z" fill="#C2401C" fill-opacity="0.14"/>
    <path d="M175 46 L200 71 L175 71 Z" stroke="#1C1812" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- text lines -->
    <g stroke="#1C1812" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round">
      <path d="M92 92h64"/>
      <path d="M92 106h84"/>
      <path d="M92 120h84"/>
      <path d="M92 134h48"/>
    </g>
    <!-- read-through meter: the thing the plugin actually reports -->
    <rect x="92" y="160" width="84" height="7" rx="3.5" fill="#1C1812" fill-opacity="0.12"/>
    <rect x="92" y="160" width="58" height="7" rx="3.5" fill="#C2401C"/>
    <text x="92" y="188" font-family="Archivo, system-ui" font-size="12" font-weight="700" fill="#57503F">68% read</text>
  </svg>

  <div class="content">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="104" fill="#1C1812"/>
        <g transform="translate(96,96) scale(10)" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M6 3h14l6 6v20H6z" fill="#F4EEE1" stroke="#F4EEE1"/>
          <path d="M20 3v6h6" fill="#C2401C" stroke="#F4EEE1"/>
          <path d="M10 14h12M10 19h12M10 24h8" stroke="#1C1812"/>
        </g>
      </svg>
      <div class="wordmark">EveryPage</div>
    </div>
    <div class="tagline">
      Share PDFs as tracked links, embed them as flipbooks, and see
      <b>who actually reads them</b> &mdash; inside wp-admin.
    </div>
    <div class="stamp">PDF viewer &middot; Flipbook embeds &middot; Reader analytics</div>
  </div>
</body>
</html>
